name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyflakes ttkbootstrap
      - name: Lint (pyflakes)
        run: python -m pyflakes activity_logger run.py scripts
      - name: Tes
        run: python -m pytest
